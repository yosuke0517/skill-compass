name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: skill-compass-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_WORKSPACE: skill-compass-staging
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
      DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      PUBLIC_APP_URL: ${{ vars.STAGING_BASE_URL }}
      MCP_ISSUER_URL: ${{ vars.STAGING_BASE_URL }}
      MCP_RESOURCE_URL: ${{ vars.STAGING_BASE_URL }}/mcp
      MCP_ARCHITECTURE_RESOURCE_URL: ${{ vars.STAGING_BASE_URL }}/mcp/architecture
      MCP_ALLOWED_USER_ID: user_staging
      STAGING_LOGIN_EMAIL: ${{ secrets.STAGING_LOGIN_EMAIL }}
      STAGING_LOGIN_PASSWORD: ${{ secrets.STAGING_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: terraform -chdir=infra/cloudflare init -input=false
      - run: terraform -chdir=infra/cloudflare plan -input=false -var-file=environments/staging.tfvars -out=/tmp/staging.tfplan
      - run: terraform -chdir=infra/cloudflare show -json /tmp/staging.tfplan > /tmp/staging-plan.json
      - run: pnpm exec tsx scripts/cloudflare/assert-staging-plan.ts /tmp/staging-plan.json
      - run: terraform -chdir=infra/cloudflare apply -input=false -auto-approve /tmp/staging.tfplan
      - run: terraform -chdir=infra/cloudflare output -json | pnpm exec tsx scripts/cloudflare/render-deploy-config.ts
      - run: pnpm build:cloudflare
      - name: Update staging Worker secret
        run: printf %s "$SESSION_SECRET" | pnpm exec wrangler secret put SESSION_SECRET --config .cloudflare/deploy-values.json --env staging
      - run: pnpm exec wrangler deploy --config .cloudflare/deploy-values.json --env staging
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/cloudflare-staging.spec.ts
      - run: pnpm exec tsx scripts/cloudflare/mcp-smoke.ts > staging-mcp-smoke.json
      - name: Write verification evidence
        run: |
          mkdir -p staging-verification
          cp staging-mcp-smoke.json staging-verification/mcp-smoke.json
          git rev-parse HEAD > staging-verification/commit-sha.txt
          sha256sum drizzle-d1/*.sql > staging-verification/d1-migrations.sha256
          sha256sum /tmp/staging-plan.json > staging-verification/terraform-plan.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: staging-verification-${{ github.sha }}
          path: staging-verification
          retention-days: 30
