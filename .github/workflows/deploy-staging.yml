name: Diagnose staging Cloudflare auth
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - name: Verify Cloudflare credential without exposing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os, json, re, urllib.request, urllib.error
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          print(json.dumps({"token_present": bool(token), "token_has_outer_whitespace": token != token.strip(), "account_id_valid": bool(re.fullmatch(r"[0-9a-f]{32}", account))}))
          if not token or not re.fullmatch(r"[0-9a-f]{32}", account):
              raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          endpoints = [
              ("account_token_verify", f"/accounts/{account}/tokens/verify", True),
              ("user_token_verify", "/user/tokens/verify", True),
              ("staging_d1_read", f"/accounts/{account}/d1/database/67368e49-a902-487d-a904-1138392d05a7", False),
          ]
          for label, path, verify in endpoints:
              request = urllib.request.Request("https://api.cloudflare.com/client/v4" + path, headers={"Authorization": "Bearer " + token}, method="GET")
              try:
                  response = opener.open(request, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception:
                  print(json.dumps({"check": label, "transport_error": True}))
                  continue
              with response:
                  code = response.code
                  raw = response.read()
              try:
                  body = json.loads(raw)
              except Exception:
                  print(json.dumps({"check": label, "http_status": code, "invalid_json": True}))
                  continue
              result = body.get("result") or {}
              safe = {"check": label, "http_status": code, "success": body.get("success") is True,
                      "error_codes": [e.get("code") for e in body.get("errors", []) if isinstance(e, dict) and isinstance(e.get("code"), int)]}
              if verify and isinstance(result, dict):
                  for key in ("id", "status", "not_before", "expires_on"):
                      value = result.get(key)
                      if value is None or (isinstance(value, str) and re.fullmatch(r"[a-zA-Z0-9:.+_-]{1,80}", value)):
                          safe[key] = value
              print(json.dumps(safe))
